site_name: Understanding GitHub Copilot
site_description: A comprehensive guide to every GitHub Copilot customization and agentic feature.
site_url: https://nishanil.github.io/copilot-guide/
repo_url: https://github.com/nishanil/copilot-guide
repo_name: nishanil/copilot-guide

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
    - navigation.instant
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true

extra_css:
  - overrides/extra.css

nav:
  - index.md

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mkdocs-material mkdocs-git-revision-date-localized-plugin

      - name: Prepare docs source
        run: |
          mkdir -p docs/overrides
          cp overrides/extra.css docs/overrides/extra.css
          cp overrides/main.html docs/overrides/main.html
          # Strip <div align="center"> wrapper so MkDocs renders the header markdown properly
          awk '/<div align="center">/{next} !done && /<\/div>/{done=1; next} 1' README.md > docs/index.md
          # Generate SVG diagram from the At a Glance ASCII art
          python3 scripts/generate-glance-svg.py README.md docs/at-a-glance.svg
          # Inject SVG image into the svg-glance div for Pages
          sed -i 's|<!-- SVG generated at build time for GitHub Pages; not visible on GitHub.com -->|<img src="at-a-glance.svg" alt="At a Glance" style="max-width:100%">|' docs/index.md

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
